<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>week03 - Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-amber-100 text-amber-900">
    <main class="max-w-5xl mx-auto">
        <h1 class="my-10 text-center">
            <span class="block text-4xl tracking-widest">― MEMBER ―</span>
            <span class="block mt-2 text-xl text-amber-600">チームメンバー紹介</span>
        </h1>
        <div class="flex flex-col justify-between gap-6 px-2 mb-10 md:flex-row md:px-8">
            <div class="w-full p-6 bg-white border border-amber-900 rounded-lg md:max-w-80">
                <div class="mb-6">
                    <img src="img/icon1.png" alt="山田太郎のアイコン" class="rounded-full w-40 mx-auto">
                    <h2 class="mt-4 text-center text-2xl font-bold">山田 太郎</h2>
                </div>
                <div class="flex flex-col gap-4">
                    <div class="flex items-center gap-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">大学</p>
                        <p>〇〇大学</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">学部</p>
                        <p>経営学部</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">学年</p>
                        <p>大学2年生</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">趣味</p>
                        <p>映画鑑賞、散歩</p>
                    </div>
                    <div class="flex items-start gap-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">一言</p>
                        <p>新しいことに挑戦するのが好きです！</p>
                    </div>
                </div>
            </div>

            <div class="w-full p-6 bg-white border border-amber-900 rounded-lg md:max-w-80">
                <div class="mb-6">
                    <img src="img/icon2.png" alt="佐藤花子のアイコン" class="rounded-full w-40 mx-auto">
                    <h2 class="mt-4 text-center text-2xl font-bold">佐藤 花子</h2>
                </div>
                <div>
                    <div class="flex items-center gap-4 mb-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">大学</p>
                        <p>△△大学</p>
                    </div>
                    <div class="flex items-center gap-4 mb-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">学部</p>
                        <p>文学部</p>
                    </div>
                    <div class="flex items-center gap-4 mb-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">学年</p>
                        <p>大学1年生</p>
                    </div>
                    <div class="flex items-center gap-4 mb-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">趣味</p>
                        <p>カフェ巡り、食べ歩き</p>
                    </div>
                    <div class="flex items-start gap-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">一言</p>
                        <p>休日はカフェ巡りを楽しんでいます。</p>
                    </div>
                </div>
            </div>

            <div class="w-full p-6 bg-white border border-amber-900 rounded-lg md:max-w-80">
                <div class="mb-6">
                    <img src="img/icon3.png" alt="佐藤一郎のアイコン" class="rounded-full w-40 mx-auto">
                    <h2 class="mt-4 text-center text-2xl font-bold">佐藤 一郎</h2>
                </div>
                <div>
                    <div class="flex items-center gap-4 mb-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">大学</p>
                        <p>✕✕大学</p>
                    </div>
                    <div class="flex items-center gap-4 mb-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">学部</p>
                        <p>理工学部</p>
                    </div>
                    <div class="flex items-center gap-4 mb-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">学年</p>
                        <p>大学1年生</p>
                    </div>
                    <div class="flex items-center gap-4 mb-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">趣味</p>
                        <p>旅行、サッカー観戦</p>
                    </div>
                    <div class="flex items-start gap-4">
                        <p class="shrink-0 px-4 py-1 rounded-lg bg-amber-200">一言</p>
                        <p>好きなことにはとことん夢中になります。</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
  </body>
</html>
